<!doctype html>
<html lang="th" data-theme="dark" data-lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPARX — Operational tools for messy F&amp;B workflows</title>
    <meta name="description" content="SPARX builds operational tools for messy F&B workflows. By Rhachata Meesilp — chef-turned-builder focused on restaurant tech, automation, and AI agents." />
    <meta name="author" content="Rhachata Meesilp" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/png" href="/assets/images/sparx-favicon.png" />

    <!-- Restore theme + lang before first paint to avoid FOUC -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('lang') || 'th';
        document.documentElement.lang = l === 'th' ? 'th' : 'en';
        document.documentElement.dataset.lang = l;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
